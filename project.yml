name: BLERemotePad
options:
  createIntermediateGroups: true
  minimumXcodeGenVersion: 2.38.0
  projectFormat: xcode15_3
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.5
    TARGETED_DEVICE_FAMILY: "1"

targets:
  BLERemotePad:
    type: application
    platform: iOS
    deploymentTarget: "15.5"
    sources:
      - path: .
        excludes:
          - "WatchApp"
    dependencies:
      - target: WatchApp
        embed: true
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.aerkkungcnx.BLERemotePad
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
  WatchApp:
    type: watchos.app
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aerkkungcnx.BLERemotePad.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSMotionUsageDescription: "We need access to the barometer and motion sensors to show real-time altitude and motion data."
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""

schemes:
  BLERemotePad:
    build:
      targets:
        BLERemotePad: all
        WatchApp: all
    run:
      config: Debug
    archive:
      config: Release
